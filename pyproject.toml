[project]
name = "text-to-reality"
version = "0.1.0"
description = "Give your agent the power to build real things: parts list, printed parts, wiring, code and a picture guide anyone can follow."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.11"
authors = [{ name = "ai-wes" }]
keywords = ["mcp", "agent", "skills", "electronics", "cad", "hardware", "esp32", "arduino"]
classifiers = [
  "Programming Language :: Python :: 3",
  "Topic :: Scientific/Engineering :: Electronic Design Automation (EDA)",
]
dependencies = ["mcp>=2.3,<3"]

[project.urls]
Homepage = "https://github.com/ai-wes/text-to-reality"
Issues = "https://github.com/ai-wes/text-to-reality/issues"

[project.scripts]
text-to-reality = "text_to_reality.cli:main"

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/text_to_reality"]

[tool.hatch.build.targets.wheel.force-include]
"skills/text-to-reality/references/connector-usage.md" = "text_to_reality/data/connector_usage.md"

[tool.hatch.build.targets.sdist]
include = ["/src", "/skills", "/tests", "/docs", "/README.md", "/LICENSE", "/pyproject.toml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
